  <rect x="124" y="0" width="8" height="1024" fill="#FFFFFF" />
  <rect x="0" y="124" width="1024" height="8" fill="#FFFFFF" />
  <rect x="252" y="0" width="8" height="1024" fill="#FFFFFF" />
  <rect x="0" y="252" width="1024" height="8" fill="#FFFFFF" />
  <rect x="380" y="0" width="8" height="1024" fill="#FFFFFF" />
  <rect x="0" y="380" width="1024" height="8" fill="#FFFFFF" />
  <rect x="508" y="0" width="8" height="1024" fill="#FFFFFF" />
  <rect x="0" y="508" width="1024" height="8" fill="#FFFFFF" />
  <rect x="636" y="0" width="8" height="1024" fill="#FFFFFF" />
  <rect x="0" y="636" width="1024" height="8" fill="#FFFFFF" />
  <rect x="764" y="0" width="8" height="1024" fill="#FFFFFF" />
  <rect x="0" y="764" width="1024" height="8" fill="#FFFFFF" />
  <rect x="892" y="0" width="8" height="1024" fill="#FFFFFF" />
