<?xml version="1.0" encoding="UTF-8"?>
<!--
  WorstGestalt background grid, Xcode-logo style: a full-bleed 8px lattice
  every 128px on the 1024 canvas. Drawn behind the glyph; the plate
  gradient shows through, layer opacity in icon.json keeps it subtle.
-->
